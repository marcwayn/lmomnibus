[workspace]
resolver = "2"
members = ["crates/lmo-core", "crates/lmo-web", "crates/lmo-ingest"]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true

# Size-optimized profile for the WASM bundle shipped to the browser.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

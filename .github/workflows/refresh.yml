name: Daily catalog refresh

# Re-fetches the OpenRouter catalog every morning (and re-reads the
# open-weight models' Hugging Face repos), appends what changed to
# data/changes.jsonl (append-only: a second run the same day adds to the
# tape, never replaces it), and commits the snapshot — git history is the
# archive of daily snapshots. Deploys only if a CLOUDFLARE_API_TOKEN secret
# is set; without one, the snapshot still lands in the repo and the next
# manual `npm run deploy` publishes it. Scheduled workflows run from the
# default branch, so this starts once it is merged into main.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # A manual dispatch from another branch must not commit or deploy from it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Backstop: the refresh normally takes a few minutes; Hugging Face reads stop at 20.
    timeout-minutes: 45
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      # The branch tip, not the triggering commit, so a queued or re-run job
      # builds on the latest snapshot.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Ingest refuses a feed that shrinks the catalog by more than 20%. The
      # Hugging Face step (scripts/hf.ts) is best effort: if it fails, the
      # previous weights data stays and the prices still refresh.
      - name: Fetch the catalog and record what changed
        env:
          # Optional: a Hugging Face token only raises the anonymous rate
          # limits. Gated repos are read through public copies, never with it.
          # Unset, this is empty and hf.ts runs anonymously.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: npm run refresh

      # Fails on an expired promo in data/overrides.json, among other things:
      # a person should re-check the vendor's price before it's published.
      - name: Test
        run: npm test

      # Build before committing, so a snapshot that can't be built never lands.
      - name: Build
        run: npm run build

      - name: Commit the snapshot
        id: commit
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          as_of=$(node -p "require('./data/catalog-meta.json').as_of")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Catalog refresh $as_of"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The token is visible to this step only, not to dependency installs.
      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 228f729fff526c6edfe462fe689d4c7f
        run: npx wrangler pages deploy dist --project-name lmomnibus --branch main
